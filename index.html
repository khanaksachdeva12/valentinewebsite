<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      background: linear-gradient(#ffdee9, #b5fffc);
      font-family: "Comic Sans MS", cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 300px;
    }

    h1 {
      color: #ff4d6d;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #ccc;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💘 Hey love 💘</h1>
    <p>Will you be my Valentine?</p>
    <button id="yes" onclick="sayYes()">Yes 💖</button>
    <button id="no" onmouseover="moveNo()">No 😅</button>
    <p id="response"></p>
  </div>

  <script>
    function sayYes() {
      document.getElementById("response").innerHTML =
        "YAY!! 💕 I can’t wait for Valentine’s Day with you 🥰";
    }

    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * 150 - 75;
      const y = Math.random() * 150 - 75;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>

</body>
</html>
